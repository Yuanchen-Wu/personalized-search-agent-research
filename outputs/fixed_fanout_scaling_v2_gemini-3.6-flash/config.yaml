  fanout_plans_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/fanout_plans.jsonl
  search_cache_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/search_cache.jsonl
  fanout_scores_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/fanout_scores.jsonl
  retrieval_scores_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/retrieval_scores.jsonl
  final_response_scores_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/final_response_scores.jsonl
  summary_by_method_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/summary_by_method.csv
  summary_by_method_task_type_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/summary_by_method_task_type.csv
  summary_by_method_task_category_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/summary_by_method_task_category.csv
  summary_by_method_domain_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/summary_by_method_domain.csv
  quality_cost_frontier_path: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash/quality_cost_frontier.csv
