experiment_name: fixed_fanout_scaling_v2_gemini-3.6-flash
methods:
- fixed_k1
- fixed_k2
- fixed_k4
- fixed_k8
fixed_fanout:
  candidate_pool_size: 8
  k_values:
  - 1
  - 2
  - 4
  - 8
  use_nested_prefixes: true
search:
  search_depth: basic
  max_results_per_branch: 5
synthesis:
  evidence_budget_mode: all
  max_documents: null
  max_context_chars: null
models:
  planner: gemini-3.6-flash
  synthesizer: gemini-3.5-flash
  evaluator: gemini-3.5-flash
reproducibility:
  seed: 42
  cache_fanout_plans: true
  cache_search_results: true
  resume_existing_runs: true
data:
  personas_path: data/synthetic_personas_v1.jsonl
  queries_path: data/synthetic_queries_v1.jsonl
outputs:
  run_dir: outputs/fixed_fanout_scaling_v2_gemini-3.6-flash
