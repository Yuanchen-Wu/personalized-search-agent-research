experiment_name: placement_ablation_v2_gemini-3.1-pro-preview
variants:
- V0_generic_single
- V1_generic_fanout
- V2_synthesis_only_personalization
- V3_fanout_only_personalization
- V4_personalized_fanout
- V5_mixed_fanout
task_types:
- retrieval_sensitive
- synthesis_sensitive
task_categories:
  retrieval_sensitive:
  - travel_dining
  - shopping_product_recommendation
  - form_policy_deadline_lookup
  - jurisdiction_resource_lookup
  - product_or_program_comparison
  - current_rule_limit_lookup
  synthesis_sensitive:
  - technical_explanation
  - personal_decision_strategy
  - legal_decision_strategy
  - legal_issue_explanation
  - financial_concept_explanation
  - financial_decision_strategy
search_required: true
metrics:
  final_response:
  - intent_satisfaction
  - personalization_target_use
  - overpersonalization
  - specificity
  - safety
  fanout:
  - persona_field_use
  - query_specificity
  - query_diversity
  - search_realism
  - faithfulness_to_user_query
  - overpersonalization_risk
  retrieval:
  - result_persona_fit
  - evidence_relevance
data:
  personas_path: data/v2/synthetic_personas_v2.jsonl
  queries_path: data/v2/synthetic_queries_v2.jsonl
outputs:
  run_dir: outputs/placement_ablation_v2_gemini-3.1-pro-preview
  runs_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/runs.jsonl
  retrieval_scores_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/retrieval_scores.jsonl
  final_response_scores_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/final_response_scores.jsonl
  fanout_scores_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/fanout_scores.jsonl
  summary_by_variant_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/summary_by_variant.csv
  summary_by_variant_task_type_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/summary_by_variant_task_type.csv
  summary_by_variant_task_category_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/summary_by_variant_task_category.csv
  summary_contrasts_by_task_type_path: outputs/placement_ablation_v2_gemini-3.1-pro-preview/contrasts_by_task_type.csv
