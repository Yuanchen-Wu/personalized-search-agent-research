experiment_name: seqpersona_k8_v1

# Sequential persona-gap retrieval, cost-matched to fixed_k8: exactly 8
# searches per item, spent one at a time — after each search a LEAK-FREE
# critic infers which of THIS user's needs the evidence still misses and
# writes the next query. Final synthesis uses the same BASE synthesizer as
# the fixed_k arms so the comparison isolates the retrieval policy.
#
# The pairwise opponent is the existing fixed_k8 rows of the C2 v2
# gemini-3.6-flash arm — planner/critic here is pinned to the SAME model
# (3.6-flash) so the head-to-head differs only in retrieval policy.
# (C2 showed the planner axis is flat, so this choice is belt-and-braces.)

methods:
  - seqpersona_k8

search:
  search_depth: basic
  max_results_per_branch: 5

synthesis:
  evidence_budget_mode: all
  max_documents: null
  max_context_chars: null

models:
  planner: gemini-3.6-flash      # seed query + per-step persona-gap critic
  synthesizer: gemini-3.5-flash  # base prompt, same as fixed_k arms
  evaluator: gemini-3.5-flash    # same pinned judge as the C2 v2 arms

reproducibility:
  seed: 42
  cache_fanout_plans: true
  cache_search_results: true
  resume_existing_runs: true

data:
  personas_path: data/synthetic_personas_v1.jsonl
  queries_path: data/synthetic_queries_v1.jsonl

outputs:
  run_dir: outputs/seqpersona_k8_v1
  runs_path: outputs/seqpersona_k8_v1/runs.jsonl
  fanout_plans_path: outputs/seqpersona_k8_v1/fanout_plans.jsonl
  search_cache_path: outputs/seqpersona_k8_v1/search_cache.jsonl
  fanout_scores_path: outputs/seqpersona_k8_v1/fanout_scores.jsonl
  retrieval_scores_path: outputs/seqpersona_k8_v1/retrieval_scores.jsonl
  final_response_scores_path: outputs/seqpersona_k8_v1/final_response_scores.jsonl
  summary_by_method_path: outputs/seqpersona_k8_v1/summary_by_method.csv
  summary_by_method_task_type_path: outputs/seqpersona_k8_v1/summary_by_method_task_type.csv
  summary_by_method_task_category_path: outputs/seqpersona_k8_v1/summary_by_method_task_category.csv
  summary_by_method_domain_path: outputs/seqpersona_k8_v1/summary_by_method_domain.csv
  quality_cost_frontier_path: outputs/seqpersona_k8_v1/quality_cost_frontier.csv
  marginal_gains_path: outputs/seqpersona_k8_v1/marginal_gains.csv
