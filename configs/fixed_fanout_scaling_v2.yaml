experiment_name: fixed_fanout_scaling_v2

# C2 rerun: identical nested-prefix design and V1 benchmark data as the
# original run, but with MODELS PINNED (the original recorded only the
# floating gemini-flash-latest alias, which resolved to 3.5-flash at run
# time in July 2026 and has since moved).
#
# Design decisions (2026-08-02):
#   - synthesizer is FIXED at gemini-3.5-flash for every arm, so the
#     PLANNER model is the sole experimental variable (query-planning
#     quality vs the k-scaling curve, with synthesis + judge constant).
#   - planner is the per-arm knob: scripts/run_c2_v2.sh --planner-model
#     overrides it via a derived config; this base config pins the
#     baseline planner (3.5-flash = same as the original C2).
#   - evaluator stays on the fixed gemini-flash-latest measuring stick
#     used by all C1/C2/C3 scoring.

methods:
  - fixed_k1
  - fixed_k2
  - fixed_k4
  - fixed_k8

fixed_fanout:
  candidate_pool_size: 8
  k_values: [1, 2, 4, 8]
  use_nested_prefixes: true

search:
  search_depth: basic
  max_results_per_branch: 5

synthesis:
  evidence_budget_mode: all # 'all' or 'fixed_document_budget'
  max_documents: null
  max_context_chars: null

models:
  planner: gemini-3.5-flash
  synthesizer: gemini-3.5-flash
  evaluator: gemini-flash-latest

reproducibility:
  seed: 42
  cache_fanout_plans: true
  cache_search_results: true
  resume_existing_runs: true

data:
  personas_path: data/synthetic_personas_v1.jsonl
  queries_path: data/synthetic_queries_v1.jsonl

outputs:
  run_dir: outputs/fixed_fanout_scaling_v2
  runs_path: outputs/fixed_fanout_scaling_v2/runs.jsonl
  fanout_plans_path: outputs/fixed_fanout_scaling_v2/fanout_plans.jsonl
  search_cache_path: outputs/fixed_fanout_scaling_v2/search_cache.jsonl
  fanout_scores_path: outputs/fixed_fanout_scaling_v2/fanout_scores.jsonl
  retrieval_scores_path: outputs/fixed_fanout_scaling_v2/retrieval_scores.jsonl
  final_response_scores_path: outputs/fixed_fanout_scaling_v2/final_response_scores.jsonl
  summary_by_method_path: outputs/fixed_fanout_scaling_v2/summary_by_method.csv
  summary_by_method_task_type_path: outputs/fixed_fanout_scaling_v2/summary_by_method_task_type.csv
  summary_by_method_task_category_path: outputs/fixed_fanout_scaling_v2/summary_by_method_task_category.csv
  summary_by_method_domain_path: outputs/fixed_fanout_scaling_v2/summary_by_method_domain.csv
  quality_cost_frontier_path: outputs/fixed_fanout_scaling_v2/quality_cost_frontier.csv
  marginal_gains_path: outputs/fixed_fanout_scaling_v2/marginal_gains.csv
